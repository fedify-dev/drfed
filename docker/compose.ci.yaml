# CI only: run the documented examples against the image under test, on a
# free loopback port.  The documentation does not include this file.
services:
  drfed:
    image: ${DRFED_IMAGE:?Set DRFED_IMAGE to the image under test}
    ports: !override
      - "127.0.0.1::8888"
