# Layer this file over compose.pglite.yaml or compose.postgres.yaml to serve
# the frontend from its own container:
#
#     docker compose -f compose.yaml -f compose.web.yaml up -d

# region compose
services:
  drfed:
    command: ["drfed-server", "--no-web"]
    environment:
      # The frontend's public origin, where login links point.
      DRFED_LOGIN_ORIGINS: '["http://localhost:3000"]'

  web:
    image: ghcr.io/fedify-dev/drfed:0.2.0
    command: ["drfed-web"]
    depends_on:
      - drfed
    environment:
      DRFED_PUBLIC_ORIGIN: http://localhost:3000
      DRFED_BACKEND_URL: http://drfed:8888
      # The backend is plain HTTP on the Compose network, not loopback.
      DRFED_ALLOW_INSECURE_BACKEND: "true"
    ports:
      - "127.0.0.1:3000:3000"
    stop_grace_period: 20s
    restart: unless-stopped
# endregion compose
