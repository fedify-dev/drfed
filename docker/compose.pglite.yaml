# region compose
name: drfed

services:
  drfed:
    image: ghcr.io/fedify-dev/drfed:0.2.0
    environment:
      # The origin browsers and other servers reach DrFed at.  Instances are
      # its subdomains, such as http://alice.drfed.localhost:8888.
      DRFED_ROOT_ORIGIN: http://drfed.localhost:8888
      # Print login links to the container log instead of sending mail.
      DRFED_MAIL_LOG_CONTENT: "true"
    ports:
      - "127.0.0.1:8888:8888"
    volumes:
      - drfed-data:/var/lib/drfed
    # Longer than DrFed's own 10-second shutdown deadline.
    stop_grace_period: 20s
    restart: unless-stopped

volumes:
  drfed-data:
# endregion compose
