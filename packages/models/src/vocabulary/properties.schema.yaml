$schema: "https://json-schema.org/draft/2020-12/schema"
type: object
minProperties: 1
propertyNames:
  format: iri
additionalProperties:
  type: object
  required: [label, description, source]
  additionalProperties: false
  properties:
    label:
      $ref: "#/$defs/localizedText"
    description:
      $ref: "#/$defs/localizedText"
    range:
      type: array
      minItems: 1
      uniqueItems: true
      items:
        type: string
        format: iri
    multiple:
      type: boolean
    source:
      type: string
      format: uri
$defs:
  localizedText:
    type: object
    required: [en]
    additionalProperties:
      type: string
      minLength: 1
