name: github-release

on:
  workflow_call:
    inputs:
      build:
        description: The calculated release build identity
        required: true
        type: string

permissions:
  contents: read

jobs:
  github-release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: npm-publish
      cancel-in-progress: false
      queue: max
    env:
      DRFED_RELEASE_BUILD: ${{ inputs.build }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5.2.6
        with:
          cache: false
          experimental: true
      - uses: actions/download-artifact@v8.0.2
        with:
          name: drfed-${{ github.run_id }}
          path: release-artifacts
      - uses: actions/download-artifact@v8.0.2
        with:
          name: drfed-image-index-${{ github.run_id }}
          path: image-artifacts/index
      - name: Create or verify the frozen release and its exact assets
        run: mise run release:github
