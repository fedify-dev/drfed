name: main

on:
  push:
    branches: [main]
    tags: ["*.*.*"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-caller-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  check:
    uses: ./.github/workflows/check.yaml

  test:
    uses: ./.github/workflows/test.yaml
    with:
      release: >-
        ${{ github.repository == 'fedify-dev/drfed' && !github.event.deleted }}

  version:
    uses: ./.github/workflows/version.yaml

  artifacts:
    needs: [version, check, test]
    if: needs.version.outputs.enabled == 'true'
    permissions:
      contents: read
      actions: read
      packages: read
    uses: ./.github/workflows/artifacts.yaml
    with:
      build: ${{ needs.version.outputs.build }}

  publish:
    needs: [version, artifacts]
    if: >-
      github.repository == 'fedify-dev/drfed' && !github.event.deleted &&
      needs.version.outputs.enabled == 'true'
    permissions:
      contents: read
      id-token: write
      packages: write
      attestations: write
      artifact-metadata: write
    uses: ./.github/workflows/publish.yaml
    with:
      build: ${{ needs.version.outputs.build }}

  github-release:
    needs: [version, publish]
    if: >-
      github.repository == 'fedify-dev/drfed' && !github.event.deleted &&
      github.ref_type == 'tag' && needs.version.outputs.enabled == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/github-release.yaml
    with:
      build: ${{ needs.version.outputs.build }}

  docs:
    needs: [version]
    if: ${{ !cancelled() && needs.version.result != 'failure' }}
    uses: ./.github/workflows/docs.yaml
    with:
      build: ${{ needs.version.outputs.build }}

  docs-release:
    needs: [version, docs, github-release]
    if: >-
      github.repository == 'fedify-dev/drfed' && !github.event.deleted &&
      github.ref_type == 'tag' && needs.version.outputs.enabled == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
      deployments: write
    uses: ./.github/workflows/docs-release.yaml
    with:
      build: ${{ needs.version.outputs.build }}

  docs-canary:
    needs: [version, check, test, docs, publish]
    if: >-
      github.repository == 'fedify-dev/drfed' && !github.event.deleted &&
      github.ref == 'refs/heads/main' &&
      needs.version.outputs.enabled == 'true'
    permissions:
      contents: read
      deployments: write
    uses: ./.github/workflows/docs-canary.yaml
    with:
      build: ${{ needs.version.outputs.build }}
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
