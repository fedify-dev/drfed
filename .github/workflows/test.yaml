name: test

on:
  pull_request:
  # Validate branch pushes even before a PR exists; PRs also cover forks.
  push: # jactionlint ignore=duplicate-triggers
    branches: ["**", "!main"]
  workflow_call:
    inputs:
      release:
        description: Whether an authorized release replaces workspace image tests
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # Script tests that do not depend on the OS run once, outside the test matrix.
  test-scripts:
    name: test (scripts)
    timeout-minutes: 30
    concurrency:
      group: test-scripts-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5.2.6
        with:
          cache: true
          experimental: true
          log_level: ${{ runner.debug == '1' && 'trace' || 'info' }}
      - run: mise run test:scripts
        env:
          MISE_LOG_LEVEL: ${{ runner.debug == '1' && 'trace' || 'info' }}

  test:
    name: test (${{ matrix.os }}, shard ${{ matrix.shard }})
    timeout-minutes: 30
    concurrency:
      group: >-
        test-${{ github.workflow }}-${{ github.ref }}-${{ matrix.os }}-${{ matrix.shard }}
      cancel-in-progress: false
      queue: max
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest-m, macos-latest, windows-latest-l]
        shard: ["1/3", "2/3", "3/3"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5.2.6
        with:
          cache: true
          experimental: true
          log_level: ${{ runner.debug == '1' && 'trace' || 'info' }}
      - run: mise test --shard ${{ matrix.shard }}
        env:
          MISE_LOG_LEVEL: ${{ runner.debug == '1' && 'trace' || 'info' }}
          LOGTAPE_TEST_MODE: ${{ runner.debug == '1' && 'always' || 'on-failure' }}
          LOGTAPE_TEST_LOWEST_LEVEL: ${{ runner.debug == '1' && 'trace' || 'debug' }}

  # Non-release refs build and test the image with both engines.
  image-pr:
    if: ${{ !inputs.release }}
    timeout-minutes: 45
    concurrency:
      group: image-pr-${{ github.workflow }}-${{ github.ref }}-${{ matrix.engine }}-${{ matrix.arch }}
      cancel-in-progress: false
      queue: max
    strategy:
      fail-fast: false
      matrix:
        engine: [docker, podman]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5.2.6
        with:
          cache: true
          experimental: true
          log_level: ${{ runner.debug == '1' && 'trace' || 'info' }}
      - uses: ./.github/actions/containerd-image-store
        if: matrix.engine == 'docker'
      - uses: ./.github/actions/pasta-apparmor
        if: matrix.engine == 'podman'
      # podman compose hands the default API address to its provider.
      - name: Start the Podman API socket
        if: matrix.engine == 'podman'
        run: systemctl --user start podman.socket
      - name: Show the Podman toolchain
        if: matrix.engine == 'podman'
        run: podman version && podman compose version
      - name: Build the image from the packed workspace
        run: mise run image:build --engine "${{ matrix.engine }}"
      - name: Test the exact image layout
        run: mise run "test:image:${{ matrix.engine }}" --require
