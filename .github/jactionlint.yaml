profile: default
self-hosted-runner:
  labels:
    - ubuntu-latest-m
    - windows-latest-l
rules:
  unpinned-uses:
    # Maintainers use current release tags for these actions rather than hashes.
    policies:
      actions/checkout: ref-pin
      jdx/mise-action: ref-pin
      actions/upload-artifact: ref-pin
      actions/download-artifact: ref-pin
      actions/upload-pages-artifact: ref-pin
      actions/deploy-pages: ref-pin
